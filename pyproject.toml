[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-survival-map"
version = "0.1.0"
description = "NASA/PDS data collection and survivability scoring for a Mars survival map"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "requests>=2.31", "pillow>=10"]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "netCDF4"]
dev = ["pytest>=7"]

[project.scripts]
mars-survival = "mars_survival.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
