<style>

:root {
  /* project palette: leaf, sky, Martian red, yellow, crimson, orange, violet */
  --leaf: #4a9a2f;   --sky: #2f9be0;   --mars: #b8432a;  --sun: #f0bf2b;

  --left: 372px; --right: 392px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ---------- structure: navigation | map | details ---------- */
#app { display: grid; grid-template-columns: var(--left) 1fr var(--right); height: 100%; transition: grid-template-columns .22s ease; }

#right { box-shadow: -1px 0 0 var(--line), -4px 0 18px rgba(27,37,64,.07); }
.scroll { overflow-y: auto; overscroll-behavior: contain; height: 100%; }

/* ---------- brand + search ---------- */

.search { position: relative; margin: 10px 14px 4px; }

.search input::placeholder { color: var(--ink-3); }
.search input:focus { background: #fff; border-color: var(--sky); outline: none; box-shadow: 0 0 0 3px rgba(47,155,224,.18); }

<script type="module">

const $ = id => document.getElementById(id);
const COL = { leaf: '#4a9a2f', sky: '#2f9be0', mars: '#b8432a', sun: '#f0bf2b', crimson: '#a1162f', ember: '#ec7a2c', violet: '#6a3fa8', ink: '#1b2540' };
const HAZ_COL = [COL.leaf, COL.sun, COL.ember, COL.crimson];
const MARS_R = 3396190;

/* ============================== texts ============================== */
const T = makeT('index');
document.documentElement.lang = LANG;
const set = (id, v) => { const e = $(id); if (e) e.textContent = v; };
['navpace', 'title', 'mterrain', 'mwalk', 'msafety', 'msol', 'hsafety', 'lsafety', 'shelter', 'reach', 'reachlead', 'eva2', 'res', 'lreach', 'los', 'loslead', 'ant', 'rx', 'llos', 'shadow', 'shadowlead', 'hourl', 'lshadow', 'hterrain', 'lterrain', 'opacity', 'hazclass', 'hwalk', 'lwalk', 'opt', 'walker', 'mass', 'power', 'why', 'hsol', 'lsol', 'season', 'evanote', 'sources', 'globe', 'overview'].forEach(k => set('t-' + k, T(k)));
$('t-hazclass').textContent = T('hazclass');
set('swap', T('swap')); set('clear', T('clear')); set('dlroute', T('dl')); set('resetw', T('reset')); set('o-energy', T('oenergy')); set('o-time', T('otime'));

/* ============================== data ============================== */
const SITE = (() => { const q = new URLSearchParams(location.search).get('site'); return q && /^[a-z0-9_-]+$/i.test(q) ? `data/sites/${q}/` : 'data/site/'; })();   // ?site=<id> opens a detail window listed in data/sites.json
const f32 = async n => { const r = await fetch(`${SITE}${n}`); if (!r.ok) throw new Error(n); return new Float32Array(await r.arrayBuffer()); };

let meta, G, prov = null; const layerImgs = {};
try {
  meta = await (await fetch(SITE + 'site.json')).json();
  let dem, slope, rough, tmult;
  if (meta.pack) {   // packed fixed-point files (see export_site): decode once to the float32 arrays every tool uses
    const u = async (n, T) => new T(await (await fetch(SITE + n)).arrayBuffer()), K = meta.pack;
    const [d16, s8, r16] = await Promise.all([u('dem16.bin', Uint16Array), u('slope8.bin', Uint8Array), u('rough16.bin', Uint16Array)]);
    const n = d16.length, ref = meta.walker.rough_ref_m, rmax = meta.walker.rough_max_m;

    for (let i = 0; i < n; i++) {
      dem[i] = K.zmin + d16[i] * K.zscale; slope[i] = s8[i] * K.slope_step_deg; const r = r16[i] * K.rough_step_m; rough[i] = r;
      tmult[i] = r > rmax ? Infinity : 1 + (r / ref) * (r / ref);
    }
  } else [dem, slope, rough, tmult] = await Promise.all(['dem.bin', 'slope.bin', 'rough.bin', 'tmult.bin'].map(f32));   // sites built before packing
  G = { dem, slope, rough, tmult, w: meta.width, h: meta.height, px: meta.px_m };
  await Promise.all(['hillshade', 'hazard'].map(async n => { layerImgs[n] = await img(`${SITE}${n}.png`); }));   // slope and roughness pictures are fetched only when that layer is switched on
  try { prov = await (await fetch(SITE + 'provenance.json')).json(); } catch (e) {}
} catch (e) {
  document.querySelector('#left .scroll').innerHTML = `<div class="panel on"><h2>${T('title')}</h2><p class="lead">${T('nodata')}</p><pre>${T('nodatacmd')}</pre></div>`;
  throw e;
}
const W = G.w * G.px, H = G.h * G.px, P = meta.params;
const WK = meta.walker || { mass_kg: 170, power_w: 326, g: 3.71, level_scale: 0.75 };
const walker = { massKg: WK.mass_kg, powerW: Math.round(WK.power_w), g: WK.g, levelScale: WK.level_scale };
const defaults = { massKg: walker.massKg, powerW: walker.powerW };
set('siteinfo', meta.name);
if (meta.synthetic) { $('banner').style.display = 'block'; $('banner').textContent = T('synth'); }

/* ============================== utilities ============================== */
const hzClass = (s, r) => { const l = (v, a, b, c) => (v > a) + (v > b) + (v > c);
  return Math.max(l(s, P.slope_caution_deg, P.slope_hazard_deg, P.slope_max_deg), l(r, P.rough_caution_m, P.rough_hazard_m, P.rough_max_m)); };
const fmtH = h => { const m = Math.round(h * 60); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`; };
const fmtE = j => { const wh = j / 3600; return wh >= 1000 ? [(wh / 1000).toFixed(2), 'kWh'] : [Math.round(wh).toLocaleString(), 'Wh']; };
const fmtD = m => m >= 1000 ? [(m / 1000).toFixed(2), 'km'] : [Math.round(m), 'm'];
const latlon = (r, c) => { if (meta.center_lat == null) return null; const n = (G.h / 2 - r) * G.px, e = (c - G.w / 2) * G.px;
  return [meta.center_lat + n / MARS_R * 180 / Math.PI, meta.center_lon + e / (MARS_R * Math.cos(meta.center_lat * Math.PI / 180)) * 180 / Math.PI]; };

const chip = k => `<span class="chip ${k}">${T({ data: 'chipdata', model: 'chipmodel', assumed: 'chipassumed' }[k])}</span>`;

/* ============================== 2D map ============================== */
const map = L.map('map', { crs: L.CRS.Simple, minZoom: -6, maxZoom: 3, zoomSnap: 0.25, attributionControl: false, zoomControl: false });

const bounds = [[0, 0], [H, W]];
map.fitBounds(bounds, { paddingTopLeft: [0, 0] }); map.setMaxBounds([[-H * .3, -W * .3], [H * 1.3, W * 1.3]]);
L.imageOverlay(SITE + 'hillshade.png', bounds, { className: 'base-img', zIndex: 1 }).addTo(map);
let photo = null; try { const r = await fetch(SITE + 'photo.json'); if (r.ok) photo = await r.json(); } catch (e) { /* no photo for this window */ }
const photoOvl = photo ? L.imageOverlay(SITE + photo.file, bounds, { zIndex: 2 }) : null;
const vis = { photo: false, slope: false, roughness: false, hazard: true, flats: true };
let lineK = 1; try { lineK = Math.min(3, Math.max(.4, +localStorage.getItem('msm.lineK') || 1)); } catch (e) { /* storage unavailable: default */ }
const SAF = {}, safVis = { reach: true, los: false, shadow: false }, safOvl = {};
const ovl = {}, op = () => parseFloat($('opacity').value);
for (const n of ['slope', 'roughness', 'hazard']) ovl[n] = L.imageOverlay(`${SITE}${n}.png`, bounds, { opacity: op(), zIndex: 3 });
const flatLayer = L.layerGroup(), userLayer = L.layerGroup().addTo(map), cursorLayer = L.layerGroup().addTo(map);
(meta.flat_sites || []).forEach(s => L.circle(ll(s.row, s.col), { radius: s.radius_m, color: COL.sky, weight: 2.5, fillColor: COL.sky, fillOpacity: .16 })
  .bindTooltip(T('flatn', s.rank, s.mean_slope_deg)).addTo(flatLayer));
function syncLayers() {
  for (const n of ['slope', 'roughness']) if (vis[n] && !layerImgs[n]) img(`${SITE}${n}.png`).then(i => { layerImgs[n] = i; tex3dDirty = true; }).catch(() => {});
  if (photoOvl) { vis.photo ? photoOvl.addTo(map) : map.removeLayer(photoOvl); photoOvl.setOpacity(($('photoop') ? $('photoop').value : 100) / 100); }
  for (const n of ['slope', 'roughness', 'hazard']) { vis[n] ? ovl[n].addTo(map) : map.removeLayer(ovl[n]); ovl[n].setOpacity(op()); }
  vis.flats ? flatLayer.addTo(map) : map.removeLayer(flatLayer);
  syncSaf(); tex3dDirty = true; set('opv', Math.round(op() * 100) + '%');
}

/* scale bar (CRS.Simple: 1 unit = 1 m) */
function updScale() {
  const mpp = 1 / Math.pow(2, map.getZoom()), target = 110 * mpp, pow = Math.pow(10, Math.floor(Math.log10(target)));
  const nice = [1, 2, 5, 10].map(k => k * pow).filter(v => v <= target * 1.2).pop() || pow;
  $('scalebar').style.width = (nice / mpp) + 'px'; set('scalelab', nice >= 1000 ? (nice / 1000) + ' km' : nice + ' m');
}
map.on('zoom move', updScale); updScale();
map.on('mousemove', e => { const rc = cellAt(e.latlng); if (!rc) return; const i = rc[0] * G.w + rc[1];
  $('hover').style.display = 'block'; set('hover', T('hover', Math.round(e.latlng.lng), Math.round(H - e.latlng.lat), G.dem[i].toFixed(0), G.slope[i].toFixed(1))); });

/* ============================== layers (left panel) ============================== */
const swatch = { slope: `linear-gradient(90deg,${COL.leaf},${COL.sun},${COL.ember},${COL.crimson})`, roughness: `linear-gradient(90deg,#e9dccf,#b98a62,#7a4a2a)`,
  hazard: `linear-gradient(90deg,${HAZ_COL.join(',')})`, flats: COL.sky, photo: 'linear-gradient(90deg,#3a3a3a,#bdbdbd)' };
const tgl = (id, on) => `<span class="tg"><input type="checkbox" data-l="${id}" ${on ? 'checked' : ''} aria-label="${T('layers')[id][0]}"><i></i></span>`;
$('layerbox').innerHTML = Object.keys(T('layers')).filter(id => id !== 'photo' || photo).map(id => { const [a, b] = T('layers')[id];
  return `<div class="layer"><span class="sw" style="background:${swatch[id]}"></span><div><b>${a}</b><small>${b}</small></div>${tgl(id, vis[id])}</div>`; }).join('');
if (photo) { $('layerbox').insertAdjacentHTML('beforeend', `<label class="phop"><span>${T('photoop')} <b id="phop-v">100%</b></span><input id="photoop" type="range" min="10" max="100" value="100"></label>`);
  $('photoop').oninput = e => { photoOvl.setOpacity(e.target.value / 100); set('phop-v', e.target.value + '%'); if (!vis.photo) { vis.photo = true; document.querySelector('[data-l=photo]').checked = true; syncLayers(); photoOvl.setOpacity(e.target.value / 100); } }; }
$('layerbox').addEventListener('change', e => { const l = e.target.dataset.l; if (l) { vis[l] = e.target.checked; syncLayers(); } });
$('opacity').oninput = syncLayers;
/* detail levels: other windows of data/sites.json that contain this window's centre (e.g. 4 m whole window, 1 m native sub-window) */
try {
  const all = await (await fetch('data/sites.json')).json(), R = 3396190, k = Math.PI / 180;
  const here = all.filter(q => Math.abs((meta.center_lon - q.center_lon) * k * R * Math.cos(q.center_lat * k)) <= q.width_m / 2 && Math.abs((meta.center_lat - q.center_lat) * k * R) <= q.height_m / 2).sort((a, b) => b.px_m - a.px_m);
  if (here.length > 1) $('tiers').innerHTML = `<div class="tiers"><b>${T('tiers')}</b>` + here.map(q => `<a href="${q.href}" class="${q.px_m === meta.px_m || (q.href === 'index.html' ? SITE === 'data/site/' : SITE.endsWith('/' + q.id + '/')) ? 'on' : ''}">${+q.px_m.toFixed(2)} m<small>${(q.width_m / 1000).toFixed(1)} km</small></a>`).join('') + `<small>${T('tiernote')}</small></div>`;

const pr = (v, d = 2) => +v.toFixed(d);
$('hazlegend').innerHTML = [0, 1, 2, 3].map(i => {

const PW = 352, PH = 190, PL = 38, PR = 8, PT = 8, PB = 24;
function profileSvg(rt) {
  const W_ = PW, H_ = PH, pl = PL, pr_ = PR, pt = PT, pb = PB, xs = rt.profile_dist_m, ys = rt.profile_m, X1 = xs[xs.length - 1] || 1;
  let lo = Math.min(...ys), hi = Math.max(...ys); if (hi - lo < 4) { hi += 2; lo -= 2; } const padv = (hi - lo) * .08; lo -= padv; hi += padv;
  const sx = x => pl + x / X1 * (W_ - pl - pr_), sy = y => H_ - pb - (y - lo) / (hi - lo) * (H_ - pt - pb);
  let area = `M${sx(0)},${H_ - pb} ` + xs.map((x, i) => `L${sx(x).toFixed(1)},${sy(ys[i]).toFixed(1)}`).join(' ') + ` L${sx(X1)},${H_ - pb}Z`;
  let segs = '';
  for (let i = 1; i < xs.length; i++) { const fl = Math.sqrt(Math.max((xs[i] - xs[i - 1]) ** 2 - (ys[i] - ys[i - 1]) ** 2, 1e-9)), sl = Math.atan2(Math.abs(ys[i] - ys[i - 1]), fl) * 180 / Math.PI;

  const ticks = [0, .25, .5, .75, 1].map(f => `<text x="${sx(X1 * f)}" y="${H_ - 8}" font-size="11.5" fill="#7b869c" text-anchor="${f === 0 ? 'start' : f === 1 ? 'end' : 'middle'}">${fmtD(X1 * f).join(' ')}</text>`).join('');
  return `<svg class="chart" id="profsvg" viewBox="0 0 ${W_} ${H_}" role="img" aria-label="${T('profile')}"><path d="${area}" fill="${COL.violet}" opacity=".10"/>
    <line x1="${pl}" x2="${W_ - pr_}" y1="${H_ - pb}" y2="${H_ - pb}" stroke="#dde2ea"/>
    <text x="${pl - 6}" y="${pt + 8}" font-size="11.5" fill="#7b869c" text-anchor="end">${Math.round(hi)}</text><text x="${pl - 6}" y="${H_ - pb}" font-size="11.5" fill="#7b869c" text-anchor="end">${Math.round(lo)}</text>

}
